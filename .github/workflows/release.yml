name: Release

on:
  push:
    tags:
      - 'v0.1.*'

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract build number from tag
        id: ver
        run: |
          TAG="${{ github.ref_name }}"           # e.g. v0.1.042
          BUILD=$(echo "$TAG" | sed 's/v0\.1\.//')  # → 042
          BUILD_INT=$(echo "$BUILD" | sed 's/^0*//')  # → 42 (no leading zero for Xcode)
          BUILD_INT=${BUILD_INT:-0}
          echo "build=$BUILD_INT"        >> "$GITHUB_OUTPUT"
          echo "version=0.1.$BUILD"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          CERT_P12:     ${{ secrets.CERTIFICATE_P12 }}
          CERT_PASS:    ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" build.keychain
          rm cert.p12

      - name: Generate Xcode project
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          # Inject public key into project.yml before generation
          sed -i '' "s/SPARKLE_ED_PUBLIC_KEY: \"\"/SPARKLE_ED_PUBLIC_KEY: \"$SPARKLE_ED_PUBLIC_KEY\"/" project.yml
          xcodegen generate

      - name: Build archive
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          xcodebuild \
            -scheme ClaudeAgentMonitor \
            -configuration Release \
            -archivePath build/ClaudeAgentMonitor.xcarchive \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            SPARKLE_ED_PUBLIC_KEY="${{ secrets.SPARKLE_ED_PUBLIC_KEY }}" \
            archive

      - name: Export archive (Developer ID)
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/ClaudeAgentMonitor.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Claude Agent Monitor" \
            --volicon "ClaudeAgentMonitor/Resources/Assets.xcassets/AppIcon.appiconset" \
            --window-size 540 320 \
            --icon-size 120 \
            --icon "ClaudeAgentMonitor.app" 140 160 \
            --hide-extension "ClaudeAgentMonitor.app" \
            --app-drop-link 400 160 \
            "build/ClaudeAgentMonitor-${{ steps.ver.outputs.version }}.dmg" \
            "build/export/"

      - name: Notarize DMG
        env:
          APPLE_ID:       ${{ secrets.APPLE_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:  ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit \
            "build/ClaudeAgentMonitor-${{ steps.ver.outputs.version }}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASS" \
            --team-id  "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple \
            "build/ClaudeAgentMonitor-${{ steps.ver.outputs.version }}.dmg"

      - name: Sign DMG for Sparkle
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Download Sparkle tools matching the SPM version used in the project
          SPARKLE_VER="2.6.4"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" \
            | tar -xJ --strip-components=1 -C /tmp/sparkle Sparkle-${SPARKLE_VER}/bin/ 2>/dev/null || \
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" \
            | tar -xJ -C /tmp/sparkle
          find /tmp/sparkle -name "sign_update" -type f | head -1 > /tmp/sign_update_path
          SIGN_UPDATE=$(cat /tmp/sign_update_path)

          SIG=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" \
            "build/ClaudeAgentMonitor-${{ steps.ver.outputs.version }}.dmg" --ed-key-file -)
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Claude Agent Monitor ${{ steps.ver.outputs.version }}"
          body: |
            ## Claude Agent Monitor ${{ steps.ver.outputs.version }}

            ### 설치
            DMG를 다운로드 후 Applications 폴더로 드래그하세요.

            ### 요구사항
            - macOS 15.1 이상 (Apple Intelligence: Apple Silicon 필요)
          files: |
            build/ClaudeAgentMonitor-${{ steps.ver.outputs.version }}.dmg
          draft: false
          prerelease: false

      - name: Update appcast.xml
        run: |
          DMG="build/ClaudeAgentMonitor-${{ steps.ver.outputs.version }}.dmg"
          SIZE=$(stat -f%z "$DMG")
          URL="https://github.com/beret21/DaemonHunter/releases/download/${{ steps.ver.outputs.tag }}/ClaudeAgentMonitor-${{ steps.ver.outputs.version }}.dmg"
          python3 scripts/update_appcast.py \
            --url       "$URL" \
            --version   "${{ steps.ver.outputs.version }}" \
            --build     "${{ steps.ver.outputs.build }}" \
            --size      "$SIZE" \
            --signature "${{ steps.sign.outputs.signature }}"

      - name: Commit appcast.xml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast for ${{ steps.ver.outputs.version }}"
          git push origin HEAD:main
